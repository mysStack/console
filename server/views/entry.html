<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title><%= title %></title>
    <link rel="icon" href="<%= favicon %>" type="image/x-icon" />
    <% if (sharedCss) { %>
    <link href="/dist/<%= sharedCss %>" rel="stylesheet" />
    <% } %> <% entry.css.forEach(function(asset) { %>
    <link href="/dist/<%= asset %>" rel="stylesheet" />
    <% }) %>
  </head>
  <body>
    <div id="root"></div>
    <script nonce="<%= nonce %>">
      window.globals = JSON.parse(decodeURIComponent(`<%- globals %>`));
    </script>
    <% entry.js.forEach(function(asset) { %>
    <script src="/dist/<%= asset %>"></script>
    <% }) %>
  </body>
</html>
