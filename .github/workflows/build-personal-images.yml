name: Build Personal Console Image

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      source_ref:
        description: 可选的分支、标签或 commit SHA；未填写时使用 Actions 当前选择的分支
        required: false
        type: string

permissions:
  contents: read
  packages: write

jobs:
  test:
    name: Unit tests
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.source_ref || github.ref }}

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: yarn

      # Plain `yarn install`, matching the other workflows in this repo.
      - name: Install dependencies
        run: yarn install

      - name: Run unit tests
        run: yarn test

  build:
    name: Build and publish ks-console
    needs: test
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.source_ref || github.ref }}

      - name: Generate image tag
        id: image_tag
        run: |
          # 每个镜像 tag 都包含检出的分支（或标签）、上海时间和 commit。
          # Docker tag 不能包含 '/'，因此先规范化分支或标签名称。
          source_ref='${{ inputs.source_ref || github.ref_name }}'
          source_ref="$(git symbolic-ref --short HEAD 2>/dev/null || printf '%s' "$source_ref")"
          ref_tag="$(printf '%s' "$source_ref" | tr '/_' '--' | tr -cs '[:alnum:].-' '-' | sed 's/^-*//; s/-*$//')"
          timestamp="$(TZ=Asia/Shanghai date +%Y%m%d-%H%M%S)"
          commit_id="$(git rev-parse --short=12 HEAD)"
          value="${ref_tag}-${timestamp}-${commit_id}"
          echo "value=${value}" >> "$GITHUB_OUTPUT"

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3
        with:
          platforms: all

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Prepare console output
        run: make container-cross

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: mingys
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and publish ks-console
        uses: docker/build-push-action@v6
        with:
          context: .
          file: build/Dockerfile.dapper
          platforms: linux/amd64,linux/arm64
          push: true
          tags: |
            docker.io/mingys/ks-console:${{ steps.image_tag.outputs.value }}
            ghcr.io/mysstack/ks-console:${{ steps.image_tag.outputs.value }}
