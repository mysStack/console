# ks-console-v3dist-embed：4.1.5 Koa 宿主。浏览器走 NodePort 30886。
# /consolev3 HTML、登录、API 仍由本服务提供；/dist/v3dist 反代到 ks-console-embed。
apiVersion: apps/v1
kind: Deployment
metadata:
  name: ks-console-v3dist-embed
  namespace: kubesphere-system
  labels:
    app: ks-console-v3dist-embed
    purpose: v3dist-embed
    tier: frontend
spec:
  replicas: 1
  revisionHistoryLimit: 5
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: ks-console-v3dist-embed
      tier: frontend
  template:
    metadata:
      labels:
        app: ks-console-v3dist-embed
        purpose: v3dist-embed
        tier: frontend
      annotations:
        mysstack.io/host-image: ghcr.io/mysstack/ks-console:deploy-release-4.1.5-20261120-20261120-115220-e2602ee1c588
        mysstack.io/v3dist-ref: feature/v3dist-embed
        mysstack.io/console-branch: feature/v3dist-embed
    spec:
      containers:
        - name: ks-console
          image: ghcr.io/mysstack/ks-console:feature-v3dist-embed-20261124-163702-936c8941050a
          imagePullPolicy: Always
          env:
            - name: V3DIST_UPSTREAM
              value: http://ks-console-embed.kubesphere-system.svc
          ports:
            - name: http
              containerPort: 8000
              protocol: TCP
          resources:
            requests:
              cpu: 20m
              memory: 100Mi
            limits:
              cpu: '1'
              memory: 1Gi
          livenessProbe:
            tcpSocket:
              port: http
            initialDelaySeconds: 30
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 8
          readinessProbe:
            tcpSocket:
              port: http
            initialDelaySeconds: 30
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 8
---
apiVersion: v1
kind: Service
metadata:
  name: ks-console-v3dist-embed
  namespace: kubesphere-system
  labels:
    app: ks-console-v3dist-embed
    purpose: v3dist-embed
    tier: frontend
spec:
  type: NodePort
  selector:
    app: ks-console-v3dist-embed
    tier: frontend
  ports:
    - name: http
      port: 80
      targetPort: http
      nodePort: 30886
      protocol: TCP
